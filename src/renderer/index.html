<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>全岗位 AI 工作助手</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- 标题栏：产品名与系统窗口按钮；不再有菜单栏 -->
  <header class="sysbar" id="sysbar">
    <div class="sysbar-brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="#e2873f"/>
        <path d="M16 3v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="3.4" r="1.9" fill="#fff"/>
        <rect x="7" y="8" width="18" height="16" rx="6" fill="#fff"/>
        <circle cx="12.6" cy="15" r="1.8" fill="#2b3550"/>
        <circle cx="19.4" cy="15" r="1.8" fill="#2b3550"/>
        <path d="M12.6 19.4q3.4 2.8 6.8 0" stroke="#2b3550" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>全岗位 AI 工作助手</span>
    </div>
    <div class="sysbar-fill" id="sysbarFill"></div>
  </header>

  <div class="workspacebar">
    <span class="workspace-label">工作区</span>
    <nav id="navList">
      <button class="nav-item active" data-page="workbench"><span class="nav-ico"></span>岗位工作台</button>
      <button class="nav-item" data-page="files"><span class="nav-ico file"></span>本地资料</button>
      <button class="nav-item" data-page="ai"><span class="nav-ico chat"></span>AI 助手</button>
    </nav>
    <div class="workspace-fill"></div>
    <button class="util-link" id="settingsBtn">设置</button>
    <button class="assistant-picker" id="assistantPickerBtn" title="选择助手">
      <span class="assist-badge" id="pickerBadge">助</span>
      <b id="pickerName">选择助手</b>
      <span class="picker-caret">▾</span>
    </button>
  </div>

  <div class="body">
    <main class="main" id="mainArea">
      <section class="page active" id="page-workbench"></section>
      <section class="page" id="page-assistants"></section>
      <section class="page" id="page-files"></section>
      <!-- AI 助手：左侧历史对话，空态时欢迎语与输入框居中 -->
      <section class="page" id="page-ai">
        <div class="ai-wrap">
          <aside class="chatpanel in-page is-empty" id="chatPanel">
            <div class="chat-shell">
              <nav class="chat-rail" aria-label="历史对话">
                <button class="new-chat" id="newChatBtn" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8.6v6.8M8.6 12h6.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                  开启新对话
                </button>
                <div class="thread-list" id="threadList"></div>
              </nav>
              <div class="chat-stage">
                <div class="chat-log" id="chatLog"></div>
                <div class="chat-center">
                  <div class="chat-hero" id="chatHero">
                    <div class="hero-line">
                      <svg class="hero-mark" viewBox="0 0 32 32" aria-hidden="true">
                        <rect width="32" height="32" rx="10" fill="#4d6bfe"/>
                        <path d="M8.2 16.2c.2-3.7 3.1-6.5 7.8-6.5 4.6 0 7.6 2.8 7.8 6.6.1 3.5-2.2 6.3-6.1 6.8l-4.3 2.1.9-3.2c-3.5-.8-6.2-3-6.1-5.8z" fill="#fff"/>
                        <circle cx="13.2" cy="16" r="1.15" fill="#4d6bfe"/>
                        <circle cx="16.6" cy="16" r="1.15" fill="#4d6bfe"/>
                        <circle cx="20" cy="16" r="1.15" fill="#4d6bfe"/>
                      </svg>
                      <b id="chatGreet">欢迎回来，想从哪里开始？</b>
                    </div>
                  </div>
                  <div class="chat-compose">
                    <textarea id="chatInput" rows="2" placeholder="给助手发送消息"></textarea>
                    <div class="compose-row">
                      <div class="quick-prompts" id="quickPrompts"></div>
                      <button class="send-btn" id="sendBtn" type="button" aria-label="发送">
                        <svg class="ico-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6.5M12 6.5l-5.2 5.2M12 6.5l5.2 5.2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <svg class="ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="8" height="8" rx="1.4" fill="currentColor"/></svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="thread-menu" id="threadMenu" hidden>
              <button type="button" id="threadDeleteBtn">删除对话</button>
            </div>
          </aside>
        </div>
      </section>
      <!-- 以下页面不在工作区露出，仍可由系统菜单进入 -->
      <section class="page" id="page-library"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="sourceDrawer">
  <div class="drawer-head"><b>来源追溯</b><button class="ghost-btn" id="drawerClose">关闭</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="../shared/schema.js"></script>
<script src="engine/blocks.js"></script>
<script src="engine/render.js"></script>
<script src="engine/source.js"></script>
<script src="chat.js"></script>
<script src="library-ui.js"></script>
<script src="files-ui.js"></script>
<script src="settings-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
