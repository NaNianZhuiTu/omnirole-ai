<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>园区消防助手</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<main>
  <h1>园区消防助手</h1>
  <p class="sub">提出一项工作，助手会检索已授权的资料，生成文档并保存到这个助手自己的工作文档里。</p>
  <section class="card">
    <label for="taskInput">要完成的工作</label>
    <textarea id="taskInput">帮我整理今年的消防演练记录，找出已经开展的演练、参与情况和存在的问题，生成一份年度消防演练总结报告，保存到我的工作文档中。</textarea>
    <div class="row">
      <button class="primary" id="runBtn" type="button">开始执行</button>
      <button class="ghost" id="cancelBtn" type="button" hidden>取消任务</button>
      <span class="status" id="statusText">还没有任务</span>
    </div>
  </section>
  <section class="card" id="confirmCard" hidden>
    <b id="confirmTitle">需要确认</b>
    <p id="confirmTarget"></p>
    <p>修改前</p>
    <pre id="confirmBefore"></pre>
    <p>修改后</p>
    <pre id="confirmAfter"></pre>
    <div class="row">
      <button class="primary" id="approveBtn" type="button">确认执行</button>
      <button class="danger" id="rejectBtn" type="button">拒绝</button>
    </div>
  </section>
  <section class="card">
    <b>执行过程</b>
    <ul class="activity" id="activity"></ul>
  </section>
  <section class="card">
    <b>执行结果</b>
    <p id="report">完成后会显示在这里。</p>
    <p class="error" id="note"></p>
    <div id="files"></div>
  </section>
</main>
<script src="scripts/main.js"></script>
</body>
</html>
